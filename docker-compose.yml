services:

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py collectstatic --no-input &&
             python manage.py migrate --no-input &&
             daphne -b 0.0.0.0 -p 8000 gastroflow.asgi:application"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: .
    env_file: .env
    command: celery -A gastroflow worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  posnet:
    build: ./posnet
    # No public ports — only accessible inside Docker network by service name "posnet"
    # Celery connects to http://posnet:3020 internally.
    # Uncomment below only for local development/debugging:
    # ports:
    #   - "3020:3020"
    #   - "3021:3021"
    volumes:
      - ./posnet/config.json:/opt/posnet/config.json:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - static_volume:/vol/static:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
