{% extends "base.html" %}
{% load static %}
{% block title %}
    Kitchen
{% endblock title %}
{% block content %}
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h1 class="h4 fw-bold mb-0">Kitchen</h1>
        <span id="ws-status" class="badge rounded-pill bg-secondary px-3 py-2">Connecting…</span>
    </div>
    <div id="orders-container"
         class="d-flex flex-wrap gap-3 align-items-start"></div>
    <div id="empty-state"
         class="card border-0 rounded-4 shadow-sm"
         style="display:none">
        <div class="card-body p-5 text-center text-secondary">
            <p class="mb-0 fs-5">No pending orders</p>
        </div>
    </div>
    <audio id="notification-sound"
           src="{% static 'sounds/notification.mp3' %}"
           preload="auto"></audio>
{% endblock content %}
{% block extra_js %}
    <style>
    #orders-container .order-card {
        flex: 1 1 340px;
        max-width: 420px;
        font-size: 1.05rem;
    }
    .item-row.is-done .item-name {
        text-decoration: line-through;
        opacity: 0.45;
    }
    .item-row.is-removed .item-name {
        text-decoration: line-through;
        color: #dc3545;
    }
    .order-card .card-header {
        font-size: 1.1rem;
    }
    </style>
    <script>
const WS_URL = `ws://${window.location.host}/ws/kitchen/orders/`;

const STATUS_COLORS = {
    order:      { header: "bg-warning text-dark",  badge: "bg-warning text-dark"  },
    preparing:  { header: "bg-primary text-white", badge: "bg-primary"            },
    ready:      { header: "bg-success text-white", badge: "bg-success"            },
};

let socket;

// ── WebSocket ─────────────────────────────────────────────────────────────────

function connect() {
    socket = new WebSocket(WS_URL);

    socket.onopen = () => setWsStatus("Connected", "bg-success");

    socket.onclose = () => {
        setWsStatus("Disconnected — reconnecting…", "bg-danger");
        setTimeout(connect, 3000);
    };

    socket.onerror = () => setWsStatus("Connection error", "bg-danger");

    socket.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        switch (msg.type) {
            case "initial_orders":
                msg.orders.forEach(renderOrder);
                refreshEmptyState();
                break;
            case "new_order":
                renderOrder(msg.order);
                playSound();
                refreshEmptyState();
                break;
            case "order_status_update":
                updateOrderStatus(msg.order_id, msg.new_status);
                break;
            case "order_item_removed":
                markItemRemoved(msg.item_id);
                break;
        }
    };
}

// Keepalive ping every 30s
setInterval(() => {
    if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: "ping" }));
    }
}, 30_000);

connect();

// ── Rendering ─────────────────────────────────────────────────────────────────

function renderOrder(order) {
    if (document.getElementById(`order-${order.id}`)) return; // already shown

    const colors = STATUS_COLORS[order.status] ?? STATUS_COLORS.order;
    const time   = order.created_at.slice(11, 16); // HH:MM

    const itemsHtml = order.order_items.map(item => renderItemRow(order.id, item)).join("");

    const card = document.createElement("div");
    card.className = "order-card card border-0 rounded-4 shadow";
    card.id = `order-${order.id}`;
    card.innerHTML = `
        <div class="card-header rounded-top-4 ${colors.header} px-3 py-2">
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold">Table: ${escHtml(order.table)}</span>
                <span class="badge bg-white bg-opacity-25 fw-normal">${time}</span>
            </div>
            <small class="opacity-75">${escHtml(order.sender)}</small>
        </div>
        <ul class="list-group list-group-flush" id="items-${order.id}">
            ${itemsHtml}
        </ul>
        <div class="card-footer d-flex gap-2 bg-transparent pt-2 pb-3 px-3">
            <button class="btn btn-warning rounded-pill flex-fill fw-semibold" onclick="sendStatus(${order.id}, 'preparing')">
                Preparing
            </button>
            <button class="btn btn-success rounded-pill flex-fill fw-semibold" onclick="sendStatus(${order.id}, 'ready')">
                Ready
            </button>
        </div>`;

    document.getElementById("orders-container").appendChild(card);
}

function renderItemRow(orderId, item) {
    const doneClass  = item.is_done ? "is-done" : "";
    const noteHtml   = item.note
        ? `<br><small class="text-secondary">${escHtml(item.note)}</small>`
        : "";
    const doneBtn    = item.is_done ? "" : `
        <button class="btn btn-outline-success btn-sm rounded-pill px-3 flex-shrink-0" onclick="itemDone(${orderId}, ${item.id}, this)">
            Done
        </button>`;

    return `
        <li class="list-group-item item-row ${doneClass}" id="item-${item.id}">
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div class="item-name">
                    <span class="fw-semibold">
                        ${escHtml(item.name_snapshot)}
                        <span class="badge bg-secondary rounded-pill ms-1">×${item.quantity}</span>
                    </span>
                    ${noteHtml}
                </div>
                ${doneBtn}
            </div>
        </li>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────

function sendStatus(orderId, action) {
    socket.send(JSON.stringify({ action, order_id: orderId }));
}

function itemDone(orderId, itemId, btn) {
    btn.disabled = true;
    socket.send(JSON.stringify({
        action: "item_done",
        order_id: orderId,
        item_id: itemId,
        username: "kitchen",
    }));
    markItemDone(itemId);
}

// ── State updates ─────────────────────────────────────────────────────────────

function updateOrderStatus(orderId, newStatus) {
    const card   = document.getElementById(`order-${orderId}`);
    if (!card) return;
    const colors = STATUS_COLORS[newStatus] ?? STATUS_COLORS.order;
    const header = card.querySelector(".card-header");
    // swap colour classes
    Object.values(STATUS_COLORS).forEach(c => {
        header.classList.remove(...c.header.split(" "));
    });
    header.classList.add(...colors.header.split(" "));

    if (newStatus === "ready") {
        // fade out and remove the card after a short delay
        card.style.transition = "opacity 1.5s";
        card.style.opacity = "0.4";
        setTimeout(() => { card.remove(); refreshEmptyState(); }, 6_000);
    }
}

function markItemDone(itemId) {
    const row = document.getElementById(`item-${itemId}`);
    if (!row) return;
    row.classList.add("is-done");
    const btn = row.querySelector("button");
    if (btn) btn.remove();
}

function markItemRemoved(itemId) {
    const row = document.getElementById(`item-${itemId}`);
    if (!row) return;
    row.classList.remove("is-done");
    row.classList.add("is-removed");
    const btn = row.querySelector("button");
    if (btn) btn.remove();
    // insert a small REMOVED badge
    const badge = document.createElement("span");
    badge.className = "badge bg-danger ms-2";
    badge.textContent = "REMOVED";
    row.querySelector(".item-name")?.appendChild(badge);
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function refreshEmptyState() {
    const empty = document.getElementById("empty-state");
    const has   = document.getElementById("orders-container").children.length > 0;
    empty.style.display = has ? "none" : "";
}

function setWsStatus(text, cls) {
    const el = document.getElementById("ws-status");
    el.textContent = text;
    el.className = `badge rounded-pill px-3 py-2 ${cls}`;
}

function playSound() {
    document.getElementById("notification-sound")?.play().catch(() => {});
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g , "&lt;") .replace( />/g, "&gt;")
        .replace(/"/g, "&quot;");
}
    </script>
{% endblock extra_js %}
