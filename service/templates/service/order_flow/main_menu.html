{% extends "base.html" %}
{% load i18n %}
{% block title %}
    {% trans "Waiter Menu" %}
{% endblock title %}
{% block content %}
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card border-0 rounded-4 shadow">
                <div class="card-body p-4 p-md-5">
                    <h5 class="fw-bold mb-4">{% trans "What do you want to do?" %}</h5>
                    <div class="d-grid gap-3">
                        <a href="{% url 'service:order-select-table' %}"
                           class="btn btn-outline-primary rounded-pill fw-bold py-3 fs-4">
                            {% trans "Create order" %}
                        </a>
                        <a href="{% url 'service:order-select-table' %}?action=add-to-order"
                           class="btn btn-outline-primary rounded-pill fw-bold py-3 fs-4">
                            {% trans "Add to order" %}
                        </a>
                        <a href="{% url 'service:order-select-table' %}?action=close-bill"
                           class="btn btn-outline-primary rounded-pill fw-bold py-3 fs-4">
                            {% trans "Active bills" %}
                        </a>
                        <a class="btn btn-outline-primary rounded-pill fw-bold py-3 fs-4"
                           type="button"
                           href="{% url 'report' %}">{% trans "Day summary" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
