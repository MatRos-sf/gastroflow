{% extends "base_auth.html" %}
{% load i18n crispy_forms_tags %}
{% block title %}
    {% trans "Login" %}
{% endblock title %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card border-0 rounded-4 shadow">
                <div class="card-body p-4 p-md-5">
                    <div class="mb-4 text-center">
                        <h3 class="fw-bold mb-1">{% trans "Welcome back" %}</h3>
                        <p class="text-muted small mb-0">{% trans "Sign in to continue" %}</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-dark rounded-pill px-4">{% trans "Sign in" %}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
