{% extends "base.html" %}
{% load i18n %}
{% block title %}
    403 — {% trans "Forbidden" %}
{% endblock title %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4 text-center py-5">
            <div class="card border-0 rounded-4 shadow">
                <div class="card-body p-5">
                    <h1 class="display-1 fw-bold text-danger mb-0">403</h1>
                    <h5 class="fw-bold mb-3">{% trans "Access Forbidden" %}</h5>
                    <p class="text-secondary mb-4">{% trans "You do not have permission to view this page." %}</p>
                    <a href="/" class="btn btn-primary rounded-pill px-4">{% trans "Go to home" %}</a>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
